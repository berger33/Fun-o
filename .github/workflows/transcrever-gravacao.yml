name: Transcrever gravação (ponte temporária)

# Usa o runner do GitHub Actions — que tem acesso aos pesos do modelo — para transcrever UMA
# gravação com timestamps, porque no sandbox do Arena huggingface.co é bloqueado.
#
# O vídeo continua vindo do Git LFS (baixa somente o arquivo indicado ou as partes listadas
# para esse original e reconstrói somente ele, se a gravação estiver dividida). A saída é texto
# (pequeno) publicado em um ramo temporário `entrega/*`, que deve ser apagado logo após a
# conferência no ambiente de destino.
#
# Configuração: `transcricao/tarefa.json` (preferida para transcrever sem disparar a ponte de
# partes) ou `transferencia/tarefa.json` (compatibilidade). A execução manual pode sobrescrever
# os campos por inputs; sem tarefa usa os padrões abaixo.

on:
  workflow_dispatch:
    inputs:
      arquivo:
        description: "Nome exato do arquivo em manifesto.csv"
        required: false
        type: string
      modelo:
        description: "Modelo faster-whisper (padrão: large-v3)"
        required: false
        default: "large-v3"
        type: string
      idioma:
        description: "Idioma da gravação (padrão: pt)"
        required: false
        default: "pt"
        type: string
      usar_vad:
        description: "Detectar trechos de fala antes da transcrição (padrão: true)"
        required: false
        type: string
      ramo_entrega:
        description: "Ramo temporário para o texto gerado"
        required: false
        type: string
  push:
    branches:
      - "transcricao/**"
      - "transferencia/**"
      - "arena/**"
    paths:
      - "transcricao/tarefa.json"
      - "transferencia/tarefa.json"

permissions:
  contents: write

jobs:
  transcrever:
    name: Transcrever com timestamps
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sem LFS)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Ler a tarefa
        id: tarefa
        env:
          ARQUIVO_INPUT: ${{ github.event.inputs.arquivo }}
          MODELO_INPUT: ${{ github.event.inputs.modelo }}
          IDIOMA_INPUT: ${{ github.event.inputs.idioma }}
          USAR_VAD_INPUT: ${{ github.event.inputs.usar_vad }}
          RAMO_ENTREGA_INPUT: ${{ github.event.inputs.ramo_entrega }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          padrao = {
              "arquivo": "Apresentação projeto 19-18.mp4",
              "modelo": "large-v3",
              "idioma": "pt",
              "usar_vad": "true",
              "ramo_entrega": "entrega/transcricao-piloto-19-18",
          }
          for caminho in ("transcricao/tarefa.json", "transferencia/tarefa.json"):
              if os.path.exists(caminho):
                  with open(caminho, encoding="utf-8") as fh:
                      lido = json.load(fh)
                      padrao.update(lido)
                      if "ramo_entrega_transcricao" in lido:
                          padrao["ramo_entrega"] = lido["ramo_entrega_transcricao"]
                      if "usar_vad" in lido:
                          valor_vad = lido["usar_vad"]
                          padrao["usar_vad"] = str(valor_vad).lower() if isinstance(valor_vad, bool) else str(valor_vad).strip().lower()
                  break
          for variavel, chave in (
              ("ARQUIVO_INPUT", "arquivo"),
              ("MODELO_INPUT", "modelo"),
              ("IDIOMA_INPUT", "idioma"),
              ("USAR_VAD_INPUT", "usar_vad"),
              ("RAMO_ENTREGA_INPUT", "ramo_entrega"),
          ):
              valor = os.environ.get(variavel, "").strip()
              if valor:
                  padrao[chave] = valor.lower() if chave == "usar_vad" else valor
          if padrao["usar_vad"] not in ("true", "false"):
              raise SystemExit("usar_vad deve ser true ou false")
          for chave in ("arquivo", "modelo", "idioma", "usar_vad", "ramo_entrega"):
              print(f"{chave}={padrao[chave]}")
          PY

      - name: Baixar o original solicitado (LFS; ou partes selecionadas)
        env:
          ARQUIVO: ${{ steps.tarefa.outputs.arquivo }}
        run: |
          set -euo pipefail
          git lfs install --local
          if [[ -f "$ARQUIVO" ]]; then
            git lfs pull --include="$ARQUIVO"
          else
            python3 - "$ARQUIVO" > /tmp/partes-lfs.txt <<'PY'
          import json, sys
          alvo = sys.argv[1]
          registros = json.load(open("partes-videos.json", encoding="utf-8"))
          encontrados = [r for r in registros if r["original"] == alvo]
          if len(encontrados) != 1:
              raise SystemExit(f"[erro] fonte ausente do Git LFS e sem índice de partes: {alvo}")
          for parte in encontrados[0]["parts"]:
              print(parte["name"])
          PY
            mapfile -t PARTES < /tmp/partes-lfs.txt
            if [[ ${#PARTES[@]} -eq 0 ]]; then
              echo "[erro] nenhuma parte encontrada para $ARQUIVO" >&2
              exit 1
            fi
            for parte in "${PARTES[@]}"; do
              echo "baixando parte selecionada: $parte"
              git lfs pull --include="$parte"
            done
            python3 tools/reconstruir_videos.py --video "$ARQUIVO"
          fi
          test -s "$ARQUIVO"
          ls -l "$ARQUIVO"

      - name: Instalar dependências
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install "faster-whisper" "av>=14.0.0" imageio-ffmpeg

      - name: Transcrever
        env:
          ARQUIVO: ${{ steps.tarefa.outputs.arquivo }}
          MODELO: ${{ steps.tarefa.outputs.modelo }}
          IDIOMA: ${{ steps.tarefa.outputs.idioma }}
          USAR_VAD: ${{ steps.tarefa.outputs.usar_vad }}
        run: |
          # Sem `set -e`: o log da tentativa precisa ser publicado mesmo em caso de falha.
          mkdir -p saida
          set -o pipefail
          python3 -v 2>/dev/null | head -1 || true
          python3 -m pip show faster-whisper ctranslate2 | sed -n '1,20p' > saida/ambiente.txt 2>&1 || true
          args=(python3 tools/transcrever.py --video "$ARQUIVO" --saida saida --modelo "$MODELO" --idioma "$IDIOMA")
          if [[ "$USAR_VAD" == "false" ]]; then args+=(--sem-vad); fi
          "${args[@]}" 2>&1 | tee saida/execucao.log
          echo "codigo_saida=${PIPESTATUS[0]}" | tee -a saida/execucao.log
          ls -l saida || true

      - name: Publicar texto no ramo temporário de entrega
        if: always()
        env:
          RAMO_ENTREGA: ${{ steps.tarefa.outputs.ramo_entrega }}
          ARQUIVO: ${{ steps.tarefa.outputs.arquivo }}
        run: |
          set -euo pipefail
          mkdir -p transferencia/transcricao
          cp saida/transcricao_bruta.txt saida/transcricao.srt saida/transcricao.vtt \
             saida/transcricao_meta.json transferencia/transcricao/ 2>/dev/null || true
          cp saida/execucao.log saida/ambiente.txt transferencia/transcricao/ 2>/dev/null || true
          {
            echo "# Transcrição automática — entrega temporária"
            echo
            echo "- Gravação: \`$ARQUIVO\`"
            echo "- Ferramenta: tools/transcrever.py (faster-whisper)"
            echo "- \`transcricao_bruta.txt\`: fala com \`[HH:MM:SS]\` por segmento"
            echo "- \`transcricao.srt\` / \`transcricao.vtt\`: legendas com timestamps"
            echo "- \`transcricao_meta.json\`: modelo, idioma detectado, duração, sha256 do vídeo"
            echo
            echo "Revise o reconhecimento contra a fonte; preserve o conteúdo integral conforme autorização do responsável e apague este ramo após a coleta."
          } > transferencia/transcricao/LEIA-ME.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A transferencia/transcricao
          git commit -m "Ponte temporária: transcrição automática de '$ARQUIVO'"
          git push --force origin "HEAD:refs/heads/$RAMO_ENTREGA"
          echo "publicado em $RAMO_ENTREGA"
